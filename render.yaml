# One-click deploy of the backend to Render's free tier.
# 1. Push this repo to GitHub.  2. https://dashboard.render.com -> New -> Blueprint -> pick the repo.
# 3. Paste ANTHROPIC_API_KEY (and optionally ADZUNA_APP_ID / ADZUNA_APP_KEY) when prompted.
services:
  - type: web
    name: firstshift-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: JOB_COUNTRY
        value: gb
      - key: ALLOWED_ORIGINS
        value: https://tenev535-boop.github.io
      - key: PYTHON_VERSION
        value: 3.12.4
