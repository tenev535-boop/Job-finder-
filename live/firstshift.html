<title>FirstShift</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: one phone-width app shell centred on the page, sticky header, fixed 3-tab bar; cards stack in one column. */
  :root {
    --bg: #eef2f6;
    --surface: #ffffff;
    --surface-2: #f5f7fa;
    --fg: #16212c;
    --muted: #5c6b7a;
    --line: #d9e0e8;
    --accent: #0f766e;
    --accent-ink: #ffffff;
    --accent-soft: #d6f1ec;
    --good: #15803d; --good-soft: #dcf5e3;
    --warn: #a16207; --warn-soft: #fdf1c7;
    --bad: #b91c1c;  --bad-soft: #fde3e3;
    --score: #d98c1f;
    --shadow: 0 1px 2px rgba(22, 33, 44, .06), 0 8px 24px rgba(22, 33, 44, .06);
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1319; --surface: #171e27; --surface-2: #1f2833; --fg: #e6ecf2; --muted: #98a6b5; --line: #2b3541;
      --accent: #2fd0bd; --accent-ink: #06201d; --accent-soft: #123b37;
      --good: #4ade80; --good-soft: #143322; --warn: #fbbf24; --warn-soft: #3a2a08; --bad: #f87171; --bad-soft: #3f1616;
      --score: #f2b04e; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1319; --surface: #171e27; --surface-2: #1f2833; --fg: #e6ecf2; --muted: #98a6b5; --line: #2b3541;
    --accent: #2fd0bd; --accent-ink: #06201d; --accent-soft: #123b37;
    --good: #4ade80; --good-soft: #143322; --warn: #fbbf24; --warn-soft: #3a2a08; --bad: #f87171; --bad-soft: #3f1616;
    --score: #f2b04e; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  .shell { max-width: 480px; margin: 0 auto; min-height: 100%; background: var(--bg); display: flex; flex-direction: column; }
  header.top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    background: var(--surface); border-bottom: 1px solid var(--line);
    padding: 14px 16px 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -.02em; line-height: 1; }
  .brand small { display: block; font-family: var(--body); font-weight: 500; font-size: 12px; color: var(--muted); letter-spacing: 0; margin-top: 4px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; border: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
  .chip.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

  main { flex: 1; padding: 16px 16px calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
  section.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); }
  h2 { font-family: var(--display); font-size: 17px; font-weight: 700; margin: 0 0 8px; letter-spacing: -.01em; text-wrap: balance; }
  h3 { font-family: var(--display); font-size: 16px; font-weight: 700; margin: 0; line-height: 1.2; text-wrap: balance; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .between { justify-content: space-between; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; border-radius: 12px; padding: 10px 14px; font-weight: 600; font-size: 14px; cursor: pointer; background: var(--surface-2); color: var(--fg); transition: transform .08s ease, background .15s ease; min-height: 42px; }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.outline { background: transparent; border-color: var(--line); }
  .btn.good { background: var(--good); color: #fff; }
  .btn.sm { padding: 6px 10px; font-size: 12.5px; min-height: 32px; border-radius: 9px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.link { background: transparent; color: var(--accent); padding: 4px 6px; min-height: 0; }
  a.btn { text-decoration: none; }
  .btn.wide { width: 100%; }

  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; min-width: 0; }
  label.f > span.hint { font-weight: 400; color: var(--muted); font-size: 12px; }
  input[type="text"], input[type="url"], input[type="time"], input[type="number"], select, textarea {
    width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 11px; font-size: 14px; min-width: 0;
  }
  textarea { resize: vertical; min-height: 84px; line-height: 1.45; }
  textarea.out { background: var(--surface-2); min-height: 120px; }

  .tag { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 3px 9px; font-size: 12px; font-weight: 600; border: 1px solid transparent; }
  .tag.good { background: var(--good-soft); color: var(--good); }
  .tag.warn { background: var(--warn-soft); color: var(--warn); }
  .tag.bad  { background: var(--bad-soft); color: var(--bad); }
  .tag.plain { background: var(--surface-2); color: var(--muted); border-color: var(--line); }
  .tag.skill { background: var(--accent-soft); color: var(--accent); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; cursor: pointer; }
  .chips button.on { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }
  .chips button.sugg { border-style: dashed; color: var(--muted); background: transparent; }

  .job { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
  .job .head { display: flex; gap: 12px; align-items: flex-start; }
  .job .head .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .job .company { color: var(--muted); font-size: 13.5px; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .fact { background: var(--surface-2); border-radius: 10px; padding: 6px 9px; font-size: 12.5px; min-width: 0; }
  .fact b { display: block; font-weight: 600; font-size: 13px; overflow-wrap: anywhere; }
  .fact.wide { grid-column: 1 / -1; }
  .desc { font-size: 13.5px; color: var(--fg); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .desc.open { display: block; }
  .reasons { border-radius: 10px; padding: 8px 10px; font-size: 12.5px; }
  .reasons ul { margin: 4px 0 0; padding-left: 18px; }
  .reasons.good { background: var(--good-soft); } .reasons.warn { background: var(--warn-soft); } .reasons.bad { background: var(--bad-soft); }

  .ring { width: 58px; flex: 0 0 58px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .ring svg { width: 56px; height: 56px; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 6; }
  .ring .track { stroke: var(--line); }
  .ring .bar { stroke: var(--score); stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
  .ring .val { position: absolute; font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
  .ring .wrap { position: relative; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; }
  .ring .lbl { font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; text-align: center; }

  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: flex; justify-content: center; pointer-events: none; }
  nav.tabs .bar { pointer-events: auto; width: 100%; max-width: 480px; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(3, 1fr); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
  nav.tabs button { position: relative; background: none; border: 0; border-radius: 12px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; font-weight: 600; color: var(--muted); cursor: pointer; }
  nav.tabs button .ico { font-size: 20px; line-height: 1; }
  nav.tabs button.on { color: var(--accent); background: var(--accent-soft); }
  nav.tabs .badge { position: absolute; top: 2px; right: 18%; background: var(--accent); color: var(--accent-ink); border-radius: 999px; font-size: 10px; padding: 1px 6px; font-weight: 700; }

  .sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(8, 14, 20, .55); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: 100%; max-width: 480px; max-height: 92vh; background: var(--bg); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; box-shadow: var(--shadow); }
  .sheet .sh { background: var(--surface); border-bottom: 1px solid var(--line); border-radius: 20px 20px 0 0; padding: 14px 16px 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .sheet .sh::before { content: ""; position: absolute; left: 50%; top: 6px; width: 40px; height: 4px; border-radius: 2px; background: var(--line); transform: translateX(-50%); }
  .sheet .sh { position: relative; }
  .sheet .body { overflow-y: auto; padding: 14px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; }
  .x { background: none; border: 0; font-size: 18px; cursor: pointer; color: var(--muted); padding: 4px 8px; border-radius: 8px; }

  .toast { position: fixed; left: 0; right: 0; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 50; display: flex; justify-content: center; pointer-events: none; padding: 0 16px; }
  .toast div { background: var(--fg); color: var(--bg); padding: 9px 14px; border-radius: 12px; font-size: 13.5px; font-weight: 500; box-shadow: var(--shadow); max-width: 440px; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { border: 1px solid var(--line); border-radius: 14px; padding: 10px; background: var(--surface); cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 2px; }
  .stat.on { outline: 2px solid var(--accent); }
  .stat .n { font-family: var(--display); font-size: 26px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 11px; font-weight: 600; color: var(--muted); line-height: 1.2; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 6px 4px; font-size: 11.5px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .seg button.on { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

  .empty { border: 1px dashed var(--line); border-radius: 16px; padding: 26px 18px; text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .empty .big { font-size: 30px; }
  .note { background: var(--accent-soft); color: var(--accent); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
  .note.warn { background: var(--warn-soft); color: var(--warn); }
  .thinking { display: flex; align-items: center; gap: 10px; padding: 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
  .spin { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: 0 0 18px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .boards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .boards a { border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-decoration: none; color: var(--fg); background: var(--surface-2); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .boards a b { font-size: 14px; }
  .boards a span { font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
  details summary { cursor: pointer; font-weight: 600; font-size: 14px; }
  .outbox { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .outbox .row { justify-content: space-between; }
  ul.tight { margin: 0; padding-left: 18px; font-size: 13.5px; }
</style>

<div class="shell">
  <header class="top">
    <div class="brand">FirstShift<small>Safe first jobs for students, 16+</small></div>
    <span class="chip accent" id="whoChip">🛡️ 16+ safe mode</span>
  </header>
  <main id="main"></main>
  <nav class="tabs" aria-label="Sections">
    <div class="bar">
      <button id="tab-finder" data-tab="finder"><span class="ico">🔍</span>Finder</button>
      <button id="tab-cv" data-tab="cv"><span class="ico">📄</span>CV &amp; Invite</button>
      <button id="tab-monitor" data-tab="monitor"><span class="ico">📊</span>Monitor<span class="badge" id="monBadge" hidden></span></button>
    </div>
  </nav>
</div>
<div id="sheetRoot"></div>
<div class="toast" id="toast" hidden><div id="toastMsg"></div></div>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------ */
  /* Storage (per viewer, per browser)                                   */
  /* ------------------------------------------------------------------ */
  const K = { profile: "fs.profile", jobs: "fs.jobs", analyses: "fs.analyses", apps: "fs.apps", skipped: "fs.skipped", tab: "fs.tab", search: "fs.search", apiKey: "fs.apiKey", adzunaId: "fs.adzunaId", adzunaKey: "fs.adzunaKey" };
  function load(k, fb) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }

  const DEFAULT_PROFILE = { name: "", age: 16, school_year: "Year 11 / Grade 10", subjects: [], hobbies: [], strengths: [], achievements: [], availability: "After school on weekdays and weekends", location: "", target_role: "part-time cafe, retail or tutoring assistant" };
  const SUGG = {
    subjects: ["Maths", "English", "Science", "Art", "PE", "Computing", "History", "Business", "Drama", "Languages"],
    hobbies: ["Football", "Gaming", "Drawing", "Music", "Coding", "Baking", "Volunteering", "Photography", "Reading", "Swimming"],
    strengths: ["Reliable", "Friendly", "Organised", "Quick learner", "Patient", "Creative", "Good with kids", "Calm under pressure"],
    achievements: ["Class representative", "Team captain", "School play", "Duke of Edinburgh", "Science fair", "Peer mentor"]
  };
  const STATUSES = [
    { id: "applied", label: "Applied / In Review", short: "Applied", emoji: "📨" },
    { id: "interview", label: "Interview Scheduled", short: "Interview", emoji: "🗓️" },
    { id: "archived", label: "Archived / Declined", short: "Archived", emoji: "🗂️" }
  ];

  const state = {
    tab: load(K.tab, "finder"),
    profile: Object.assign({}, DEFAULT_PROFILE, load(K.profile, {})),
    jobs: load(K.jobs, []),
    analyses: load(K.analyses, {}),
    apps: load(K.apps, []),
    skipped: load(K.skipped, []),
    search: Object.assign({ country: "bg", where: "", what: "part time student" }, load(K.search, {})),
    assets: null,
    monitorFilter: "all",
    showAdd: false,
    sheet: null,      // { jobId, phase: "thinking"|"done"|"error", text, error }
    sample: undefined, // undefined = not resolved yet, null = unavailable
    apiKey: load(K.apiKey, ""),
    adzunaId: load(K.adzunaId, ""), adzunaKey: load(K.adzunaKey, ""),
    live: null // { busy, jobs, status }
  };

  /* ------------------------------------------------------------------ */
  /* Example jobs (clearly marked as examples on the cards)              */
  /* ------------------------------------------------------------------ */
  const EXAMPLES = [
    { id: "ex-cafe", example: true, title: "Weekend Cafe Assistant", company: "Riverside Coffee House", location: "Downtown", pay: "$14.50/hr", schedule: "Sat & Sun, 09:00-15:00", hours_per_week: 12, shift_end: "15:00", job_type: "Part-time", description: "Greet customers, take orders on the till, keep tables clean and help the baristas restock. Full training given. Friendly, supervised team.", tags: ["customer service", "teamwork", "food"] },
    { id: "ex-library", example: true, title: "Junior Library Helper", company: "City Public Library", location: "Northside", pay: "$13.00/hr", schedule: "Tue & Thu 16:00-19:00, Sat 10:00-14:00", hours_per_week: 10, shift_end: "19:00", job_type: "Part-time", description: "Shelve returned books, help visitors find titles, support the children's reading club and set up community events.", tags: ["organisation", "reading", "kids"] },
    { id: "ex-tutor", example: true, title: "Peer Maths Tutor", company: "BrightPath Tutoring", location: "Online / Downtown", pay: "$18.00/hr", schedule: "Flexible, 2-6 h/week after school", hours_per_week: 6, shift_end: "19:00", job_type: "Part-time", description: "Help younger students with maths homework on our online whiteboard. Great for students with strong maths grades and patience.", tags: ["maths", "teaching", "patience"] },
    { id: "ex-camp", example: true, title: "Summer Camp Activity Leader", company: "Lakeside Youth Camp", location: "Lakeside", pay: "$15.00/hr", schedule: "Mon-Fri 08:30-16:30, July only", hours_per_week: 38, shift_end: "16:30", job_type: "Seasonal", description: "Lead games, sports and craft sessions for 8-12 year olds alongside senior leaders. First-aid training provided.", tags: ["sports", "leadership", "kids"] }
  ];

  /* ------------------------------------------------------------------ */
  /* Real job boards (search links built from the student's inputs)      */
  /* ------------------------------------------------------------------ */
  /* Every entry is an official search page of that platform; q and l are URL-encoded. */
  const GLOBAL_BOARDS = [
    { name: "Indeed", note: "Largest job board", url: (q, l, c) => `${c.indeed}/jobs?q=${q}&l=${l}` },
    { name: "Google Jobs", note: "Listings from many sites", url: (q, l) => `https://www.google.com/search?q=${q}+jobs+near+${l}&ibp=htl;jobs` },
    { name: "LinkedIn Jobs", note: "Company postings", url: (q, l) => `https://www.linkedin.com/jobs/search/?keywords=${q}&location=${l}` },
    { name: "Glassdoor", note: "Jobs with company reviews", url: (q) => `https://www.glassdoor.com/Job/jobs.htm?sc.keyword=${q}` }
  ];
  const COUNTRIES = {
    us: { name: "United States", indeed: "https://www.indeed.com", adzuna: "us", boards: [
      { name: "Adzuna", note: "Aggregates local ads", url: (q, l) => `https://www.adzuna.com/search?q=${q}&w=${l}` },
      { name: "Snagajob", note: "Hourly and teen-friendly jobs", url: (q, l) => `https://www.snagajob.com/search?q=${q}&w=${l}` },
      { name: "ZipRecruiter", note: "Fast one-click applications", url: (q, l) => `https://www.ziprecruiter.com/jobs-search?search=${q}&location=${l}` },
      { name: "SimplyHired", note: "Local part-time listings", url: (q, l) => `https://www.simplyhired.com/search?q=${q}&l=${l}` },
      { name: "Monster", note: "Entry-level roles", url: (q, l) => `https://www.monster.com/jobs/search?q=${q}&where=${l}` } ] },
    gb: { name: "United Kingdom", indeed: "https://uk.indeed.com", adzuna: "gb", boards: [
      { name: "Adzuna", note: "Aggregates local ads", url: (q, l) => `https://www.adzuna.co.uk/search?q=${q}&w=${l}` },
      { name: "Reed", note: "UK part-time and weekend roles", url: (q, l) => `https://www.reed.co.uk/jobs?keywords=${q}&location=${l}` },
      { name: "Find a job (GOV.UK)", note: "Official government job site", url: (q, l) => `https://findajob.dwp.gov.uk/search?q=${q}&w=${l}` },
      { name: "CV-Library", note: "Local shop and cafe jobs", url: (q, l) => `https://www.cv-library.co.uk/search-jobs?q=${q}&geo=${l}` } ] },
    ca: { name: "Canada", indeed: "https://ca.indeed.com", adzuna: "ca", boards: [
      { name: "Adzuna", note: "Aggregates local ads", url: (q, l) => `https://www.adzuna.ca/search?q=${q}&w=${l}` },
      { name: "Job Bank", note: "Government of Canada listings", url: (q, l) => `https://www.jobbank.gc.ca/jobsearch/jobsearch?searchstring=${q}&locationstring=${l}` },
      { name: "SimplyHired", note: "Local part-time listings", url: (q, l) => `https://www.simplyhired.ca/search?q=${q}&l=${l}` } ] },
    au: { name: "Australia", indeed: "https://au.indeed.com", adzuna: "au", boards: [
      { name: "Adzuna", note: "Aggregates local ads", url: (q, l) => `https://www.adzuna.com.au/search?q=${q}&w=${l}` },
      { name: "SEEK", note: "Casual and student roles", url: (q, l) => `https://www.seek.com.au/jobs?keywords=${q}&where=${l}` },
      { name: "Jora", note: "Aggregated local listings", url: (q, l) => `https://au.jora.com/j?q=${q}&l=${l}` } ] },
    de: { name: "Germany", indeed: "https://de.indeed.com", adzuna: "de", boards: [

  /* Student-safety pre-screen (deterministic, runs before any AI call)  */
  /* ------------------------------------------------------------------ */
  const BASE_RULES = { latestEnd: 22 * 60, earliestStart: 7 * 60, maxTermHours: 20, maxBreakHours: 40 };
  const country = () => COUNTRIES[state.search.country] || COUNTRIES.other;
  const rulesFor = () => Object.assign({}, BASE_RULES, country().rules || {});
  const hhmm = m => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
  const quickTerms = () => country().terms || QUICK_TERMS;
  const HAZARDS = ["forklift", "roofing", "scaffold", "excavat", "demolition", "meat slicer", "power saw", "chainsaw", "welding", "explosive", "firearm", "mining", "logging", "commercial driving", "delivery driver", "driving required", "driver's license required", "deep fryer", "industrial", "chemical handling", "pesticide", "bartend", "serve alcohol", "casino", "tobacco", "cannabis", "adult", "door to door", "door-to-door", "overnight", "graveyard shift", "night shift", "24/7", "on call", "must be 18", "18+", "18 or older", "21+"];

  function minutes(t) { const m = /^(\d{1,2}):(\d{2})$/.exec((t || "").trim()); if (!m) return null; const h = +m[1], mi = +m[2]; return (h < 24 && mi < 60) ? h * 60 + mi : null; }
  function lateTimesInText(text) {
    const RULES = rulesFor(); const found = [];
    const re = /(\d{1,2})(?::(\d{2}))?\s*(am|pm|a\.m\.|p\.m\.)/gi;
    let m;
    while ((m = re.exec(text))) {
      let h = +m[1]; const mi = m[2] ? +m[2] : 0; const pm = /p/i.test(m[3]);
      if (h === 12) h = pm ? 12 : 0; else if (pm) h += 12;
      const total = h * 60 + mi;
      if (total > RULES.latestEnd || (total < RULES.earliestStart && total > 0)) found.push(m[0].trim());
    }
    const re24 = /\b([01]?\d|2[0-3]):([0-5]\d)\b/g;
    while ((m = re24.exec(text))) { const total = +m[1] * 60 + +m[2]; if (total > RULES.latestEnd) found.push(m[0]); }
    return found;
  }
  function hoursInText(text) { const m = /(\d{1,2})\s*(?:-\s*(\d{1,2}))?\s*(?:h|hrs|hours)\s*(?:per|a|\/)\s*(?:week|wk)/i.exec(text); return m ? +(m[2] || m[1]) : null; }

  function prescreen(job) {
    const RULES = rulesFor(); const reasons = []; let blocked = false, review = false;
    const text = [job.title, job.description, job.schedule, (job.tags || []).join(" ")].join(" ").toLowerCase();
    const haz = HAZARDS.filter(h => text.includes(h));
    if (haz.length) { blocked = true; reasons.push("Restricted work or age limit mentioned: " + haz.join(", ")); }
    const end = minutes(job.shift_end);
    if (end !== null && end > RULES.latestEnd) { blocked = true; reasons.push("Shift ends after " + hhmm(RULES.latestEnd)); }
    const start = minutes(job.shift_start);
    if (start !== null && start < RULES.earliestStart) { blocked = true; reasons.push("Shift starts before " + hhmm(RULES.earliestStart)); }
    if (start !== null && end !== null && end <= start) { blocked = true; reasons.push("Overnight shift"); }
    if (end === null) {
      const late = lateTimesInText(text);
      if (late.length) { review = true; reasons.push("Late or early times mentioned: " + late.slice(0, 3).join(", ")); }
      else { review = true; reasons.push("Finish time not listed. Confirm shifts end by " + hhmm(RULES.latestEnd)); }
    }
    const hrs = job.hours_per_week || hoursInText(text);
    if (hrs === null || hrs === undefined || hrs === "") { review = true; reasons.push("Weekly hours not listed"); }
    else if (hrs > RULES.maxBreakHours) { blocked = true; reasons.push(hrs + " h/week is over the legal limit for under-18s (" + RULES.maxBreakHours + ")"); }
    else if (hrs > RULES.maxTermHours) { review = true; reasons.push(hrs + " h/week only works in school holidays"); }
    if (/full[- ]time/.test((job.job_type || "").toLowerCase())) { blocked = true; reasons.push("Full-time roles do not fit school"); }
    if (blocked) return { verdict: "blocked", tag: "Not for 16", reasons };
    if (review) return { verdict: "review", tag: "Needs Review", reasons };
    return { verdict: "approved", tag: "16+ Approved", reasons: ["Hours, times and duties pass the student-safety check"] };
  }
  function quickMatch(job) {
    const words = s => new Set((s.toLowerCase().match(/[a-z][a-z+#-]{2,}/g) || []));
    const p = state.profile; const mine = words([p.subjects, p.hobbies, p.strengths, p.achievements].flat().join(" "));
    const theirs = words([job.title, job.description, (job.tags || []).join(" ")].join(" "));
    if (!mine.size) return 35;
    let overlap = 0; mine.forEach(w => { if (theirs.has(w)) overlap++; });
    return Math.min(92, 35 + Math.min(overlap, 8) * 7);
  }

  const SAFETY_RULES = `You are the intelligence engine of a job-search app used by 16-year-old high-school students. Act as a careful careers adviser and a youth-employment compliance officer.
STUDENT SAFETY RULES (apply strictly, applicant is exactly 16 and in school full-time):
1. No night work: shifts end by 22:00 on school nights and start no earlier than 07:00.
2. No hazardous work: no power-driven machinery, forklifts, meat slicers, deep fryers, roofing, scaffolding, excavation, demolition, welding, chemicals or pesticides, mining, logging, explosives or firearms.
3. No driving as part of the job and no vehicle deliveries.
4. No alcohol, tobacco, cannabis, gambling or adult-industry environments; no serving alcohol.
5. No door-to-door sales, no unsupervised cash handling at night, no working alone late.
6. Hours must fit school: at most 20 h/week in term (40 in holidays), at most 4 h on a school day; part-time, weekend, seasonal or internship only.
7. Supervised, public environments (shops, cafes, libraries, camps, tutoring, sports clubs) are strong positives.
If information is missing do NOT assume the job is safe: mark it "Needs Review" and say what must be confirmed.
SCORING (0-100): 40 pts duties vs the student's subjects/hobbies/strengths/achievements; 30 pts schedule fit; 20 pts safety (a job that fails the rules can never score above 30); 10 pts growth value for a first job. Be honest: a mediocre fit is 40-60.
CV PROFILE: 3-5 sentences, first person, ATS-friendly, real keywords from the ad, motivation and reliability first, subjects/hobbies/achievements as evidence. Never invent jobs, employers, certificates or years of experience. No empty cliches.
INVITATION MESSAGE: exactly FOUR sentences to the recruiter: (1) greeting, role and where it was seen; (2) who the student is, a 16-year-old student, plus the one most relevant strength; (3) honest availability around school (after school, weekends, holidays); (4) polite confident close asking for a short chat or trial shift, with thanks. Warm, respectful, no slang, no exclamation marks, no emojis, no signature block, no placeholders like [Your Name].`;

  async function directClaudeJson(prompt, schema, opts) {
    let res;
    try {

        method: "POST", signal: opts && opts.signal,
        headers: { "content-type": "application/json", "x-api-key": state.apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },

      });
    } catch (e) { throw { code: (e && e.name === "AbortError") ? "cancelled" : "upstream_error", message: String(e) }; }
    if (!res.ok) {
      const body = await res.text().catch(() => "");
      throw { code: res.status === 401 ? "bad_key" : res.status === 429 ? "rate_limited" : res.status === 400 ? "invalid_request" : "upstream_error", message: body.slice(0, 300) };
    }
    const data = await res.json();
    if (data.stop_reason === "refusal") throw { code: "refused", message: "refusal" };
    const text = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("");

  const EXTRACT_SCHEMA = { type: "object", additionalProperties: false, required: ["title", "company", "location", "pay", "schedule", "hours_per_week", "shift_end", "job_type", "description"], properties: {
    title: { type: "string" }, company: { type: "string" }, location: { type: "string" }, pay: { type: "string" }, schedule: { type: "string" },
    hours_per_week: { type: ["integer", "null"] }, shift_end: { type: ["string", "null"] }, job_type: { type: "string", enum: ["Part-time", "Weekend", "Seasonal", "Internship", "Full-time"] }, description: { type: "string" } } };
  function extractPrompt(text) {
    return `Extract the job listing fields from the text below. Keep the original language for title and description. shift_end is the latest finish time mentioned as "HH:MM" (24h) or null; hours_per_week is an integer or null; pay is the wage as written or ""; schedule is the days/hours as written or ""; description is a faithful 100-250 word summary of duties, requirements and conditions (age limits, hours, night work, hazards).
Reply with ONLY a JSON object: {"title": "", "company": "", "location": "", "pay": "", "schedule": "", "hours_per_week": null, "shift_end": null, "job_type": "Part-time" | "Weekend" | "Seasonal" | "Internship" | "Full-time", "description": ""}

LISTING TEXT:
${text.slice(0, 14000)}`;
  }
  async function fetchListingText(url) {
    const readers = [
      { name: "reader", get: async () => { const r = await fetch("https://r.jina.ai/" + url, { headers: { Accept: "text/plain", "X-Return-Format": "text" } }); if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); } },
      { name: "proxy", get: async () => { const r = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(url)); if (!r.ok) throw new Error("HTTP " + r.status); const html = await r.text(); const doc = new DOMParser().parseFromString(html, "text/html"); doc.querySelectorAll("script,style,noscript,nav,footer,header").forEach(n => n.remove()); const t = (doc.title ? doc.title + "\n" : "") + (doc.body ? doc.body.innerText || doc.body.textContent : ""); return t; } }
    ];
    let lastErr;
    for (const rd of readers) { try { const t = (await rd.get()).replace(/[ \t]+/g, " ").replace(/\n{3,}/g, "\n\n").trim(); if (t.length > 200) return t; lastErr = new Error("empty"); } catch (e) { lastErr = e; } }
    throw lastErr || new Error("fetch failed");
  }
  function heuristicFields(text, url) {
    const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
    const title = (lines.find(l => l.length > 6 && l.length < 120) || "Job listing").replace(/^title:\s*/i, "");
    let company = ""; try { company = new URL(url).hostname.replace(/^www\./, ""); } catch (e) { /* ignore */ }
    return { title, company, location: "", pay: "", schedule: "", hours_per_week: null, shift_end: null, job_type: "Part-time", description: text.slice(0, 6000) };
  }
  async function extractFields(text, url) {
    if (!aiMode()) return heuristicFields(text, url);
    try {
      const raw = await askJson(extractPrompt(text), EXTRACT_SCHEMA, { cache: false });
      if (!raw || typeof raw !== "object" || !raw.title) return heuristicFields(text, url);
      return { title: String(raw.title), company: String(raw.company || ""), location: String(raw.location || ""), pay: String(raw.pay || ""), schedule: String(raw.schedule || ""), hours_per_week: Number.isFinite(+raw.hours_per_week) && raw.hours_per_week !== null && raw.hours_per_week !== "" ? Math.round(+raw.hours_per_week) : null, shift_end: /^\d{1,2}:\d{2}$/.test(String(raw.shift_end || "")) ? String(raw.shift_end).padStart(5, "0") : null, job_type: ["Part-time", "Weekend", "Seasonal", "Internship", "Full-time"].includes(raw.job_type) ? raw.job_type : "Part-time", description: String(raw.description || "").slice(0, 6000) };
    } catch (e) { if (e && e.code === "cancelled") throw e; return heuristicFields(text, url); }

    state.jobs.unshift(job); save(K.jobs, state.jobs); state.showAdd = false; render();
    if (andDraft) { doEverything(job); return; }
    const s = prescreen(job); toast(s.verdict === "approved" ? "Passes the safety check. Ready to draft." : s.verdict === "review" ? "Added. Check the flagged details before applying." : "Added, but this job is not suitable for a 16-year-old.");
  }

  function onJobAction(act, id, el) {
    const job = allJobs().find(j => j.id === id); if (!job) return;
    if (act === "more") { const d = main.querySelector(`[data-desc="${CSS.escape(id)}"]`); d.classList.toggle("open"); el.textContent = d.classList.contains("open") ? "Show less" : "Read more"; }
    else if (act === "skip") { state.skipped.push(id); save(K.skipped, state.skipped); render(); }
    else if (act === "keep") { keepJob(job); render(); toast("Saved to your list"); }
    else if (act === "all") doEverything(job);
    else if (act === "draft") { keepJob(job); openDraft(job); }
  }

  /* ------------------------------------------------------------------ */
  /* Draft sheet + AI calls                                              */
  /* ------------------------------------------------------------------ */
  let ctl = null;
  async function analyze(job) {
    if (!aiMode()) throw { code: "not_granted", message: "unavailable" };
    const screen = prescreen(job);
    const ctlLocal = new AbortController(); ctl = ctlLocal;
    const raw = await askJson(jobPrompt(job, screen), JOB_SCHEMA, { signal: ctlLocal.signal, onText: ({ text }) => { if (state.sheet && state.sheet.jobId === job.id) { state.sheet.text = text; const t = $("#streamText"); if (t) t.textContent = text.slice(-300); } } });
    const a = validAnalysis(raw); if (!a) throw { code: "invalid_json", message: "shape" };
    if (screen.verdict === "blocked" && a.legal.is_safe_for_16) { a.legal.is_safe_for_16 = false; a.legal.tag = "Not for 16"; a.legal.concerns = Array.from(new Set(screen.reasons.concat(a.legal.concerns))); a.recommendation = "skip"; a.match_score = Math.min(a.match_score, 30); }
    state.analyses[job.id] = Object.assign(a, { generated_at: new Date().toISOString() }); save(K.analyses, state.analyses);
    return a;
  }
  async function doEverything(job) {
    keepJob(job);
    if (!aiMode()) { toast(state.sample === null ? "Saved. Add a Claude API key in AI settings to draft automatically." : "Claude is still loading. Try again in a second."); render(); return; }
    if (!state.analyses[job.id]) {
      state.sheet = { jobId: job.id, phase: "thinking", text: "" }; render();
      try { await analyze(job); } catch (e) { if (state.sheet && state.sheet.jobId === job.id) { if (e.code === "cancelled") state.sheet = null; else { state.sheet.phase = "error"; state.sheet.error = errCopy(e); } } render(); return; }
    }
    const a = state.analyses[job.id];
    if (a && a.legal.is_safe_for_16 && !state.apps.some(x => x.job_id === job.id)) {
      state.apps.unshift({ id: job.id + "-" + Date.now(), job_id: job.id, title: job.title, company: job.company, url: job.url || "", match_score: a.match_score, status: "applied", applied_at: new Date().toISOString(), notes: "Draft ready. Open the listing, send the message, then update the status here.", cv_profile: a.cv_profile, invitation_message: a.invitation_message });
      save(K.apps, state.apps); toast("Draft ready and added to Monitor. Open the listing and send your message.");
    } else if (a && !a.legal.is_safe_for_16) { toast("Draft ready, but this job failed the safety check, so it was not added to Monitor."); }
    state.sheet = { jobId: job.id, phase: "done" }; render();
  }
  async function openDraft(job) {
    if (state.analyses[job.id]) { state.sheet = { jobId: job.id, phase: "done" }; render(); return; }
    if (!aiMode()) { toast(state.sample === null ? "Add a Claude API key in AI settings, or open this page inside Claude." : "Claude is still loading. Try again in a second."); return; }
    state.sheet = { jobId: job.id, phase: "thinking", text: "" }; render();
    try { await analyze(job); if (state.sheet && state.sheet.jobId === job.id) state.sheet.phase = "done"; }
    catch (e) { if (state.sheet && state.sheet.jobId === job.id) { if (e.code === "cancelled") state.sheet = null; else { state.sheet.phase = "error"; state.sheet.error = errCopy(e); } } }
    render();
  }
  async function scoreAll() {
    const pending = visibleJobs().filter(j => !j.ai).map(j => j.job); if (!pending.length) return;
    const btn = $("#scoreAll"); if (btn) { btn.disabled = true; btn.textContent = `Scoring 1 of ${pending.length}…`; }
    let done = 0, failed = 0;
    for (const job of pending) {
      try { await analyze(job); done++; } catch (e) { failed++; if (e.code === "not_granted" || e.code === "rate_limited" || e.code === "sampling_disabled") break; }
      const b = $("#scoreAll"); if (b) b.textContent = `Scoring ${done + failed + 1} of ${pending.length}…`;
    }
    render(); toast(failed ? `Scored ${done}, ${failed} could not be scored` : `Scored ${done} job${done === 1 ? "" : "s"}`);
  }

  function renderSheet() {
    const root = $("#sheetRoot");
    if (!state.sheet) { root.innerHTML = ""; document.body.style.overflow = ""; return; }
    const job = allJobs().find(j => j.id === state.sheet.jobId); if (!job) { state.sheet = null; root.innerHTML = ""; return; }
    document.body.style.overflow = "hidden";
    const a = state.analyses[job.id]; const tracked = state.apps.some(x => x.job_id === job.id);
    let body;
    if (state.sheet.phase === "thinking") {
      body = `<div class="thinking"><div class="spin"></div><div><b>Claude is reading the job…</b><p class="small muted">Scoring, safety check, CV profile and message. Usually 10-40 seconds.</p></div></div>
        <p class="small muted" id="streamText" style="white-space:pre-wrap;overflow-wrap:anywhere">${esc((state.sheet.text || "").slice(-300))}</p>
        <button class="btn outline wide" id="stopAi">Stop</button>`;
    } else if (state.sheet.phase === "error") {
      body = `<div class="note warn">${esc(state.sheet.error)}</div><div class="row"><button class="btn outline" id="closeSheet2" style="flex:1">Close</button><button class="btn primary" id="retryAi" style="flex:2">Try again</button></div>`;
    } else if (a) {
      const unsafe = !a.legal.is_safe_for_16;
      body = `
        <div class="job" style="flex-direction:row;align-items:center;gap:12px">${ring(a.match_score, "AI match")}<div class="stack" style="gap:4px;min-width:0"><span class="tag ${unsafe ? "bad" : /review/i.test(a.legal.tag) ? "warn" : "good"}">🛡️ ${esc(a.legal.tag)}</span><p class="small muted">${esc(a.legal.schedule_fit)}</p><p class="small"><b>Recommendation:</b> ${a.recommendation === "apply" ? "✅ Apply" : a.recommendation === "apply_with_caution" ? "⚠️ Apply with caution" : "⛔ Skip this one"}</p></div></div>
        ${(unsafe || a.legal.concerns.length) ? `<div class="reasons ${unsafe ? "bad" : "warn"}"><b>${unsafe ? "Not recommended for a 16-year-old" : "Check before you apply"}</b><ul>${a.legal.concerns.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>` : ""}
        <div class="outbox"><div class="row"><b>📄 CV profile</b><button class="btn sm outline" data-copy="cv">📋 Copy</button></div><textarea class="out" id="cvOut" readonly>${esc(a.cv_profile)}</textarea><div class="chips">${a.key_skills.map(s => `<span class="tag skill">${esc(s)}</span>`).join("")}</div></div>
        <div class="outbox"><div class="row"><b>✉️ Message to recruiter</b><button class="btn sm outline" data-copy="msg">📋 Copy</button></div><textarea class="out" id="msgOut" readonly>${esc(a.invitation_message)}</textarea></div>
        <div class="row"><button class="btn outline" id="closeSheet2" style="flex:1">Close</button>${job.url ? `<a class="btn outline" href="${esc(job.url)}" target="_blank" rel="noopener" style="flex:1">Open ↗</a>` : ""}<button class="btn ${unsafe ? "outline" : "good"}" id="markApplied" style="flex:2" ${tracked ? "disabled" : ""}>${tracked ? "✅ Tracking" : "📨 Mark as applied"}</button></div>
        ${unsafe && !tracked ? `<p class="small muted" style="text-align:center">This job failed the safety check. You can still track it, but talk to a parent or guardian first.</p>` : `<p class="small muted" style="text-align:center">Copy the message, send it on the job site or by email, then track it in Monitor.</p>`}`;
    } else { body = `<div class="empty"><p>Nothing here yet.</p></div>`; }

    root.innerHTML = `<div class="sheet-bg" id="sheetBg"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(job.title)}"><div class="sh"><h3 style="margin-top:6px">${esc(job.title)}</h3><button class="x" id="closeSheet" aria-label="Close">✕</button></div><div class="body">${body}</div></div></div>`;
    const close = () => { if (ctl) ctl.abort(); state.sheet = null; render(); };
    $("#sheetBg").onclick = e => { if (e.target.id === "sheetBg") close(); };
    $("#closeSheet").onclick = close; const c2 = $("#closeSheet2"); if (c2) c2.onclick = close;
    const stop = $("#stopAi"); if (stop) stop.onclick = close;
    const retry = $("#retryAi"); if (retry) retry.onclick = () => openDraft(job);
    root.querySelectorAll("[data-copy]").forEach(b => { b.onclick = () => copyText(b.dataset.copy === "cv" ? a.cv_profile : a.invitation_message, b); });
    const mark = $("#markApplied"); if (mark) mark.onclick = () => {
      state.apps.unshift({ id: job.id + "-" + Date.now(), job_id: job.id, title: job.title, company: job.company, url: job.url || "", match_score: a.match_score, status: "applied", applied_at: new Date().toISOString(), notes: "", cv_profile: a.cv_profile, invitation_message: a.invitation_message });
      save(K.apps, state.apps); state.sheet = null; state.tab = "monitor"; save(K.tab, state.tab); render(); toast("Added to your Monitor");
    };
  }

  /* ------------------------------------------------------------------ */
  /* CV & Invite                                                         */
  /* ------------------------------------------------------------------ */
  let cvBusy = false, cvError = "";
  function tagInput(field, label, hint) {
    const vals = state.profile[field]; const sugg = SUGG[field].filter(s => !vals.some(v => v.toLowerCase() === s.toLowerCase())).slice(0, 8);
    return `<div class="stack" style="gap:6px"><label class="f" for="in-${field}">${label}<span class="hint">${hint}</span></label>
      <div class="row" style="flex-wrap:nowrap"><input type="text" id="in-${field}" placeholder="Type and press Enter" style="flex:1"><button class="btn sm" data-add="${field}">Add</button></div>
      <div class="chips" data-field="${field}">${vals.map(v => `<button type="button" class="on" data-rm="${esc(v)}" title="Remove">${esc(v)} ×</button>`).join("")}${sugg.map(s => `<button type="button" class="sugg" data-sg="${esc(s)}">+ ${esc(s)}</button>`).join("")}</div></div>`;
  }
  function renderCv() {
    const p = state.profile; const can = p.subjects.length + p.hobbies.length + p.strengths.length > 0; const a = state.assets;
    main.innerHTML = `
      ${aiBanner()}
      <section class="card stack"><h2>About you</h2>
        <div class="grid2"><label class="f">First name<input type="text" id="pName" value="${esc(p.name)}" placeholder="Sam"></label><label class="f">Year / grade<input type="text" id="pYear" value="${esc(p.school_year)}"></label></div>
        <label class="f">Town / city<input type="text" id="pLoc" value="${esc(p.location)}" placeholder="Where you can travel to"></label>
        <label class="f">When can you work?<input type="text" id="pAvail" value="${esc(p.availability)}"></label>
      </section>
      <section class="card stack" style="gap:14px"><h2 style="margin:0">What makes you, you</h2>
        ${tagInput("subjects", "School subjects", "Your favourite or strongest subjects")}
        ${tagInput("hobbies", "Hobbies & activities", "Sports, clubs, volunteering, creative stuff")}
        ${tagInput("strengths", "Personal strengths", "How would a teacher or coach describe you?")}
        ${tagInput("achievements", "Achievements & roles", "Awards, responsibilities, things you're proud of")}
      </section>
      <section class="card stack"><label class="f">Type of job you're aiming for<input type="text" id="pRole" value="${esc(p.target_role)}"></label>
        <button class="btn primary wide" id="genAssets" ${!can || cvBusy || !aiMode() ? "disabled" : ""}>${cvBusy ? "Writing your profile…" : "✨ Generate CV & Invite"}</button>
        ${cvBusy ? `<button class="btn outline wide" id="stopGen">Stop</button>` : ""}
        ${!can ? `<p class="small muted" style="text-align:center">Add at least one subject, hobby or strength to generate.</p>` : ""}
        ${cvError ? `<div class="note warn">${esc(cvError)}</div>` : ""}
      </section>
      <div class="outbox"><div class="row"><b>📄 CV profile</b><button class="btn sm outline" data-copyid="cvOut2">📋 Copy</button></div><textarea class="out" id="cvOut2" placeholder="Your ATS-friendly CV summary will appear here">${esc(a ? a.cv_profile : "")}</textarea>${a && a.key_skills.length ? `<div class="chips">${a.key_skills.map(s => `<span class="tag skill">${esc(s)}</span>`).join("")}</div>` : ""}</div>
      ${a && a.cv_sections ? `<div class="outbox"><div class="row"><b>🧾 CV sections</b><button class="btn sm outline" id="copySections">📋 Copy</button></div>${Object.keys(a.cv_sections).map(k => `<div><span class="eyebrow">${esc(k)}</span><ul class="tight">${(a.cv_sections[k] || []).map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>`).join("")}</div>` : ""}
      <div class="outbox"><div class="row"><b>✉️ Recruiter invitation message</b><button class="btn sm outline" data-copyid="msgOut2">📋 Copy</button></div><textarea class="out" id="msgOut2" placeholder="A polite 4-sentence message to a recruiter will appear here">${esc(a ? a.invitation_message : "")}</textarea><p class="small muted">You can edit the text before copying.</p></div>
      ${aiSettingsCard()}
    `;
    bindAiSettings();
    const bind = (id, field) => { $(id).oninput = e => { state.profile[field] = e.target.value; save(K.profile, state.profile); if (field === "name") $("#whoChip").textContent = state.profile.name ? `Hi ${state.profile.name} 👋` : "🛡️ 16+ safe mode"; }; };
    bind("#pName", "name"); bind("#pYear", "school_year"); bind("#pLoc", "location"); bind("#pAvail", "availability"); bind("#pRole", "target_role");
    const addVals = (field, raw) => { const items = String(raw).split(",").map(s => s.trim()).filter(Boolean); if (!items.length) return; items.forEach(i => { if (!state.profile[field].some(v => v.toLowerCase() === i.toLowerCase())) state.profile[field].push(i); }); save(K.profile, state.profile); render(); };
    Object.keys(SUGG).forEach(field => {
      const inp = $(`#in-${field}`); inp.onkeydown = e => { if (e.key === "Enter" || e.key === ",") { e.preventDefault(); addVals(field, inp.value); } };
      main.querySelector(`[data-add="${field}"]`).onclick = () => addVals(field, inp.value);
      main.querySelector(`[data-field="${field}"]`).onclick = e => { const b = e.target.closest("button"); if (!b) return; if (b.dataset.rm !== undefined) { state.profile[field] = state.profile[field].filter(v => v !== b.dataset.rm); save(K.profile, state.profile); render(); } else if (b.dataset.sg) addVals(field, b.dataset.sg); };
    });
    main.querySelectorAll("[data-copyid]").forEach(b => { b.onclick = () => copyText($("#" + b.dataset.copyid).value, b); });
    const cs = $("#copySections"); if (cs) cs.onclick = () => copyText(Object.keys(a.cv_sections).map(k => k + "\n" + (a.cv_sections[k] || []).map(i => "• " + i).join("\n")).join("\n\n"), cs);
    $("#genAssets").onclick = generateAssets; const sg = $("#stopGen"); if (sg) sg.onclick = () => { if (ctl) ctl.abort(); };
  }
  async function generateAssets() {
    if (!aiMode()) return; cvBusy = true; cvError = ""; render();
    const c = new AbortController(); ctl = c;
    try {
      const raw = await askJson(assetsPrompt(), ASSETS_SCHEMA, { signal: c.signal, cache: false });
      if (!raw || typeof raw !== "object") throw { code: "invalid_json" };
      state.assets = { cv_profile: String(raw.cv_profile || ""), key_skills: Array.isArray(raw.key_skills) ? raw.key_skills.map(String) : [], invitation_message: String(raw.invitation_message || ""), cv_sections: (raw.cv_sections && typeof raw.cv_sections === "object") ? raw.cv_sections : null };
      toast("Your CV profile and message are ready");
    } catch (e) { if (e.code !== "cancelled") cvError = errCopy(e); }
    cvBusy = false; render();
  }

  /* ------------------------------------------------------------------ */
  /* Monitor                                                             */
  /* ------------------------------------------------------------------ */
  function renderMonitor() {
    const counts = {}; STATUSES.forEach(s => { counts[s.id] = state.apps.filter(a => a.status === s.id).length; });
    const list = state.apps.filter(a => state.monitorFilter === "all" || a.status === state.monitorFilter);
    main.innerHTML = `
      <div class="stats">${STATUSES.map(s => `<button class="stat ${state.monitorFilter === s.id ? "on" : ""}" data-filter="${s.id}"><span>${s.emoji}</span><span class="n">${counts[s.id]}</span><span class="l">${esc(s.label)}</span></button>`).join("")}</div>
      ${!state.apps.length ? `<div class="empty"><div class="big">📭</div><h3>Nothing tracked yet</h3><p class="muted small">Tap “Draft &amp; Apply” on a job, then “Mark as applied” to start your pipeline.</p></div>`
        : !list.length ? `<div class="empty"><div class="big">🔎</div><h3>No applications here</h3><button class="btn sm" data-filter="all">Show all</button></div>`
        : list.map(app => `<article class="job" data-app="${esc(app.id)}">
            <div class="row between" style="align-items:flex-start"><div style="min-width:0"><h3>${esc(app.title)}</h3><p class="company">${esc(app.company || "")}${app.company ? " · " : ""}applied ${new Date(app.applied_at).toLocaleDateString(undefined, { day: "numeric", month: "short" })}</p></div>${typeof app.match_score === "number" ? `<span class="tag ${app.match_score >= 75 ? "good" : app.match_score >= 50 ? "warn" : "bad"}">${app.match_score}%</span>` : ""}</div>
            <div><span class="eyebrow">Status</span><div class="seg" style="margin-top:4px">${STATUSES.map(s => `<button data-status="${s.id}" class="${app.status === s.id ? "on" : ""}">${s.emoji} ${s.short}</button>`).join("")}</div></div>
            <textarea class="notes" rows="2" placeholder="Notes: who you spoke to, interview time, what to bring…" style="min-height:56px">${esc(app.notes || "")}</textarea>
            <div class="row between"><div class="row">${app.invitation_message ? `<button class="btn sm outline" data-copymsg>📋 Message</button>` : ""}${app.cv_profile ? `<button class="btn sm outline" data-copycv>📋 CV</button>` : ""}${app.url ? `<a class="btn sm outline" href="${esc(app.url)}" target="_blank" rel="noopener">Open ↗</a>` : ""}</div><button class="btn sm link" data-remove>Remove</button></div>
            <div class="row" data-confirm hidden><span class="small muted" style="flex:1">Remove this application?</span><button class="btn sm outline" data-no>Keep</button><button class="btn sm" data-yes style="background:var(--bad-soft);color:var(--bad)">Remove</button></div>
          </article>`).join("")}`;
    main.querySelectorAll("[data-filter]").forEach(b => { b.onclick = () => { state.monitorFilter = state.monitorFilter === b.dataset.filter ? "all" : b.dataset.filter; render(); }; });
    main.querySelectorAll("[data-app]").forEach(card => {
      const app = state.apps.find(a => a.id === card.dataset.app);
      card.querySelectorAll("[data-status]").forEach(b => { b.onclick = () => { app.status = b.dataset.status; save(K.apps, state.apps); render(); }; });
      card.querySelector(".notes").oninput = e => { app.notes = e.target.value; save(K.apps, state.apps); };
      const cm = card.querySelector("[data-copymsg]"); if (cm) cm.onclick = () => copyText(app.invitation_message, cm);
      const cc = card.querySelector("[data-copycv]"); if (cc) cc.onclick = () => copyText(app.cv_profile, cc);
      const conf = card.querySelector("[data-confirm]");
      card.querySelector("[data-remove]").onclick = () => { conf.hidden = false; };
      card.querySelector("[data-no]").onclick = () => { conf.hidden = true; };
      card.querySelector("[data-yes]").onclick = () => { state.apps = state.apps.filter(a => a.id !== app.id); save(K.apps, state.apps); render(); };
    });
  }

  /* ------------------------------------------------------------------ */
  /* Boot                                                                */
  /* ------------------------------------------------------------------ */
  document.querySelectorAll("nav.tabs button").forEach(b => { b.onclick = () => { state.tab = b.dataset.tab; save(K.tab, state.tab); render(); window.scrollTo({ top: 0 }); }; });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && state.sheet) { if (ctl) ctl.abort(); state.sheet = null; render(); } });
  const hash = (location.hash || "").replace("#", ""); if (["finder", "cv", "monitor"].includes(hash)) state.tab = hash;
  render();
  resolveSample();
  window.__firstshift = { prescreen, quickMatch, boardLinks, liveSearch, doEverything, state }; // for checks
})();
</script>
